name: lint

on:
  push:
    paths: ["**.py"]
  pull_request:
    paths: ["**.py"]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff (из LINTER.md)
        run: ruff check algos/ core/ scripts/ tools/ tests/ --config .ruff.toml
      - name: Run DRY-check (наш инструмент дублей)
        run: python tools/check_duplicates.py